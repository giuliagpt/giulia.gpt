dth:1152px;margin:0 auto;padding:56px 24px 24px;text-align:center;\">\n  <span style=\"display:inline-block;font-family:var(--font-hand);font-size:15px;color:#4e0119;background:#c6dfec;border:2px dashed #4e0119;padding:6px 18px;border-radius:999px;animation:gg-wiggle 2.4s ease-in-out infinite;margin-bottom:18px;\">🪄 todo en un solo lugar<\u002Fspan><br>\n  <h1 style=\"font-family:var(--font-display);font-size:clamp(32px,7vw,52px);margin:0 0 8px;color:#4e0119;letter-spacing:0.06em;\">¡Hola! Soy Giulia Paterlini<\u002Fh1><p style=\"font-family: var(--font-hand); font-size: clamp(16px,4vw,20px); color: #4e0119; max-width: 600px; margin: 0 auto; line-height: 1.5;\">Te muestro cómo usar la IA a tu favor, sin complicarte la vida 🪄<\u002Fp>\n  \n<\u002Fsection>\n\n<section ref=\"{{ catalogSectionRef }}\" style=\"margin:40px 0 0;\">\n  <h2 style=\"max-width: 1152px; margin: 0 auto 6px; padding: 0 24px; font-family: var(--font-display); font-size: 20px; color: #4e0119\">ÍNDICE DE IA<\u002Fh2>\n  <sc-if value=\"{{ catalogClosed }}\" hint-placeholder-val=\"{{ true }}\">\n    <div sc-camel-on-click=\"{{ onToggleCatalog }}\" style=\"max-width:1152px;margin:0 auto 20px;padding:0 24px;cursor:pointer;display:flex;gap:36px;align-items:center;flex-wrap:wrap;\">\n      <div style=\"flex:1;min-width:280px;\">\n        <p style=\"font-family:var(--font-hand);font-size:19px;color:#4e0119;margin:0 0 18px;line-height:1.5;max-width:520px;\">Un fichero con todos los tips, apps y prompts de inteligencia artificial que uso día a día. Escribí tu duda como se te ocurra y encontrá la respuesta.<\u002Fp>\n        <span style=\"display:inline-block;padding:14px 28px;border-radius:999px;background:#4e0119;color:#fff4bb;font-weight:700;font-size:15px;\">Buscar en el índice<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 clamp(130px,42vw,220px);position:relative;height:clamp(90px,29vw,150px);\">\n        <div style=\"position:absolute;top:6.7%;left:9%;width:68%;height:67%;background:#fff4bb;border:2px solid #4e0119;border-radius:8px;transform:rotate(-8deg);box-shadow:3px 4px 0 rgba(78,1,25,0.2);\"><\u002Fdiv>\n        <div style=\"position:absolute;top:13.3%;left:22.7%;width:68%;height:67%;background:#c6dfec;border:2px solid #4e0119;border-radius:8px;transform:rotate(4deg);box-shadow:3px 4px 0 rgba(78,1,25,0.2);display:flex;align-items:center;justify-content:center;\">\n          <span style=\"font-family:var(--font-hand);font-size:clamp(11px,3vw,15px);color:#4e0119;\">#tips<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:absolute;top:30%;left:6.8%;width:68%;height:67%;background:#7c6c5c;border:2px solid #4e0119;border-radius:8px;transform:rotate(-3deg);box-shadow:3px 4px 0 rgba(78,1,25,0.2);display:flex;align-items:center;justify-content:center;\">\n          <span style=\"font-family:var(--font-hand);font-size:clamp(11px,3vw,15px);color:#fff4bb;\">#prompts<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  \n<\u002Fsection>\n\n<sc-if value=\"{{ showIndicePage }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:#fff4bb;z-index:90;overflow-y:auto;padding:32px 24px;\">\n  <a href=\"#\" style=\"font-weight:600;text-decoration:underline;color:#4e0119;\">← Volver<\u002Fa>\n  <h2 style=\"max-width:1152px;margin:20px auto 6px;font-family:var(--font-display);font-size:28px;color:#4e0119;\">ÍNDICE DE IA<\u002Fh2>\n  <div style=\"max-width:1152px;margin:24px auto 0;\">\n  <div style=\"background:#2a1810;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(78,1,25,0.25);\">\n    <div style=\"display:flex;align-items:center;gap:8px;padding:10px 16px;background:#1c0f09;\">\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#ff5f56;display:inline-block;\"><\u002Fspan>\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#ffbd2e;display:inline-block;\"><\u002Fspan>\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#27c93f;display:inline-block;\"><\u002Fspan>\n      <span style=\"margin-left:8px;color:#c6dfec;font-family:monospace;font-size:12px;\">giulia.gpt — buscador<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;padding:16px 20px;gap:10px;flex-wrap:wrap;\">\n      <span style=\"color:#27c93f;font-family:monospace;font-size:18px;\">$<\u002Fspan>\n      <input type=\"text\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQueryChange }}\" placeholder=\"¿cómo hago… / qué app uso para…?\" style=\"flex:1;min-width:120px;background:transparent;border:none;outline:none;color:#fff4bb;font-family:monospace;font-size:16px;caret-color:#27c93f;\">\n      <span style=\"color:#c6dfec;font-family:monospace;font-size:13px;white-space:nowrap;\">{{ resultsCount }} resultados<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"gg-scroll\" style=\"max-width:1152px;margin:20px auto 0;display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;\">\n  <sc-for list=\"{{ toolChips }}\" as=\"tool\" hint-placeholder-count=\"4\">\n    <button sc-camel-on-click=\"{{ tool.onClick }}\" style=\"{{ tool.style }}\">{{ tool.name }} ({{ tool.count }})<\u002Fbutton>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"gg-scroll\" style=\"max-width:1152px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;\">\n  <sc-for list=\"{{ tagChips }}\" as=\"tag\" hint-placeholder-count=\"4\">\n    <button sc-camel-on-click=\"{{ tag.onClick }}\" style=\"{{ tag.style }}\">#{{ tag.name }}<\u002Fbutton>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"max-width:1152px;margin:14px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;\">\n  <div style=\"display:flex;gap:8px;\">\n    <sc-for list=\"{{ sortOptionsList }}\" as=\"opt\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ onClearFilters }}\" style=\"padding:8px 16px;border-radius:8px;border:2px dashed #4e0119;background:transparent;color:#4e0119;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;\">Limpiar filtros<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1152px;margin:14px auto 0;\">\n    <button sc-camel-on-click=\"{{ onOpenAdd }}\" style=\"padding:10px 18px;border-radius:8px;border:none;background:#4e0119;color:#fff4bb;font-weight:700;font-size:14px;cursor:pointer;\">+ Agregar Tip / Prompt<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"max-width:1152px;margin:32px auto;display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;\">\n  <aside style=\"min-width:200px;flex:0 0 200px;\">\n    <h3 style=\"font-family:var(--font-display);font-size:20px;margin:0 0 12px;color:#4e0119;\">Categorías<\u002Fh3>\n    <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ cat.onClick }}\" style=\"{{ cat.style }}\">{{ cat.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Faside>\n  <div style=\"flex:1;min-width:280px;\">\n    <sc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;\">\n        <sc-for list=\"{{ cardTips }}\" as=\"tip\" hint-placeholder-count=\"6\">\n          <article sc-camel-on-click=\"{{ tip.onOpen }}\" style=\"background:#c6dfec;border-radius:10px;padding:18px;cursor:pointer;position:relative;box-shadow:2px 4px 0 rgba(78,1,25,0.15);border:2px solid #4e0119;display:flex;flex-direction:column;gap:10px;animation:gg-pop .3s ease;\">\n            <sc-if value=\"{{ tip.thumb }}\" hint-placeholder-val=\"{{ false }}\">\n              <img src=\"{{ tip.thumb }}\" alt=\"\" style=\"width:100%;height:120px;object-fit:cover;border-radius:8px;border:2px solid #4e0119;\">\n            <\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;\">\n              <span style=\"font-family:var(--font-hand);font-size:15px;color:#7c6c5c;\">{{ tip.category }}<\u002Fspan>\n              <sc-if value=\"{{ tip.is_prompt }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"background:#4e0119;color:#fff4bb;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.03em;\">PROMPT<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <h4 style=\"font-family:var(--font-display);font-size:19px;margin:0;line-height:1.25;color:#4e0119;\">{{ tip.question }}<\u002Fh4>\n            <p style=\"font-family:var(--font-body);font-size:14px;color:#4e0119;opacity:.85;margin:0;line-height:1.5;\">{{ tip.truncated }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;\">\n              <span style=\"background:#fff4bb;border:1px solid #4e0119;color:#4e0119;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;\">{{ tip.tool }}<\u002Fspan>\n              <sc-for list=\"{{ tip.tagsList }}\" as=\"tg\" hint-placeholder-count=\"2\">\n                <span style=\"font-family:var(--font-hand);font-size:13px;color:#7c6c5c;\">#{{ tg.name }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-family:var(--font-hand);font-size:20px;color:#7c6c5c;text-align:center;padding:60px 0;\">No encontré nada con esa búsqueda. Probá otras palabras.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<section style=\"background: #4e0119; margin: 60px 0 0; padding: 64px 24px; position: relative\">\n  <div style=\"max-width:1152px;margin:0 auto;display:flex;gap:48px;flex-wrap:wrap;\">\n    <div style=\"flex: 0 0 240px; position: relative\">\n      <span style=\"display:inline-block;font-family:var(--font-hand);font-size:14px;color:#c6dfec;border:1px solid #c6dfec;padding:4px 12px;border-radius:999px;margin-bottom:14px;\">Soy CEO de GÜE<\u002Fspan>\n      <h2 style=\"font-family:var(--font-display);font-size:56px;margin:0 0 6px;color:#fff4bb;line-height:1;\">GÜE<\u002Fh2>\n      <p style=\"font-family:var(--font-hand);font-size:16px;color:#c6dfec;margin:0;\">Consultora de transformación empresarial con IA<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 14px; position: relative\">\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#fff4bb;\">GÜE es una consultora de transformación empresarial con IA. Ayudamos a empresas a incorporar la tecnología. GÜE nace para cambiar el enfoque: la eficiencia no se compra, se diseña.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#c6dfec;\">No somos una agencia de software. Somos una consultora de transformación empresarial que utiliza la Inteligencia Artificial como un medio, no como un fin.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#c6dfec;\">Venimos a romper el ciclo de acumular herramientas que nadie usa y procesos que ya no funcionan.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#c6dfec;\">Nuestro compromiso es auditar, detectar el valor real y rediseñar la forma en que tu empresa opera.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;font-weight:700;color:#fff4bb;\">El objetivo es simple: que la tecnología se encargue de la ejecución, para que las personas vuelvan a encargarse de la estrategia.<\u002Fp>\n      <a href=\"mailto:infoagenciague@gmail.com?subject=Quiero%20informaci%C3%B3n%20sobre%20G%C3%9CE%20para%20mi%20empresa\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:10px;padding:14px 26px;b ;\">Fecha<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ courseLeadRows }}\" as=\"lead\" hint-placeholder-count=\"0\">\n          <sc-raw-tr style=\"border-top:1px solid #4e0119;\">\n            <sc-raw-td style=\"padding:10px 12px;font-size:14px;color:#4e0119;\">{{ lead.email }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:10px 12px;font-size:14px;color:#4e0119;\">{{ lead.dateLabel }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <sc-if value=\"{{ noCourseLeads }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-family:var(--font-hand);font-size:16px;color:#7c6c5c;margin-top:20px;\">Todavía nadie dejó su email para el curso.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showAdminLoginModal }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ onCloseModal }}\" style=\"position:fixed;inset:0;background:rgba(78,1,25,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;\">\n  <form sc-camel-on-submit=\"{{ onSubmitAdminLogin }}\" sc-camel-on-click=\"{{ stopPropagation }}\" style=\"background:#fff4bb;border-radius:14px;max-width:360px;width:100%;padding:32px;border:3px solid #4e0119;display:flex;flex-direction:column;gap:14px;\">\n    <h2 style=\"font-family:var(--font-display);font-size:22px;margin:0;color:#4e0119;\">Ingreso admin<\u002Fh2>\n    <input type=\"email\" value=\"{{ loginForm.user }}\" sc-camel-on-change=\"{{ onLoginUserChange }}\" placeholder=\"Email\" required=\"{{ true }}\" style=\"padding:10px;border-radius:8px;border:2px solid #4e0119;font-size:14px;\">\n    <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"color:#b00020;font-size:13px;margin:0;\">Email o contraseña incorrectos.<\u002Fp>\n    <\u002Fsc-if>\n    <input type=\"password\" va aphy feel, top-down flat lay --ar 4:5 --style raw',\n   tags:['portadas','estetica','midjourney'], instagram_url:'https://www.instagram.com/giulia.gpt?igsh=MWYzZHczbmdqZjNyNQ==', media_urls:[], created_at:'2026-06-30T10:00:00Z'},\n];\n\nclass Component extends DCLogic {\n  state = {\n    tips: SEED_TIPS,\n    subscribers: [],\n    isAdmin: false,\n    query: '',\n    toolFilter: null,\n    tagFilter: null,\n    categoryFilter: null,\n    sort: 'newest',\n    route: {view:'home', id:null},\n    modal: null,\n    form: {id:null, category:'', tool:'', question:'', isPrompt:false, body:'', tags:'', instagramUrl:'', mediaUrls:[], createdAt:null},\n    newsletterForm: {name:'', email:''},\n    toast: null,\n    activePanel: null,\n    courseEmail: '',\n    apps: FAVORITE_APPS,\n    newAppName: '',\n    courseLeads: [],\n    loginForm: {user:'', pass:''},\n    promptCarouselIndex: 0,\n  };\n  bodyRef = React.createRef();\n  fileInputRef = React.createRef();\n  catalogSectionRef = React.createRef();\n\n  componentDidMount() {\n    try {\n      const savedTips = localStorage.getItem('giuliagpt_tips');\n      const savedSubs = localStorage.getItem('giuliagpt_subs');\n      const savedAdmin = localStorage.getItem('giuliagpt_admin');\n      const savedApps = localStorage.getItem('giuliagpt_apps');\n      const savedLeads = localStorage.getItem('giuliagpt_course_leads');\n      this.setState({\n        tips: savedTips ? JSON.parse(savedTips) : SEED_TIPS,\n        subscribers: savedSubs ? JSON.parse(savedSubs) : [],\n        isAdmin: false,\n        apps: savedApps ? JSON.parse(savedApps) : FAVORITE_APPS,\n        courseLeads: savedLeads ? JSON.parse(savedLeads) : [],\n      }, () => this.applyHash());\n    } catch (e) { this.applyHash(); }\n    this.initFirebase();\n    this._onHash = () => this.applyHash();\n    window.addEventListener('hashchange', this._onHash);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this._onHash);\n  }\n\n  persist() {
